name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visualbridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CI: "true"
      VISUALBRIDGE_VSCODE_TEST_VERSION: "1.105.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.22.1") { throw "Expected Node v22.22.1." }
          if ((npm --version) -ne "10.9.4") { throw "Expected npm 10.9.4." }

      - name: Install from lockfile
        run: npm ci

      - name: Check dependency policy
        run: npm run check:dependencies

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check documentation contracts
        run: npm run check:docs

      - name: Package VSIX
        run: npm run package:vscode

      - name: Test packaged VSIX with VS Code CLI
        run: npm run test:cli --workspace visualbridge

      - name: Verify generated files and whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed." }
          $workspaceChanges = git status --short --untracked-files=all
          if ($workspaceChanges) {
            $workspaceChanges | Write-Host
            throw "CI commands changed tracked files or created unexpected untracked files. Regenerate, ignore intentional build output, and commit source artifacts before retrying."
          }

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visualbridge-vsix
          path: Tools/VSCodeExtension/artifacts/*.vsix
          if-no-files-found: error
